services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ku_scheduler}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ku} -d ${POSTGRES_DB:-ku_scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-ku}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ku_scheduler}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (voir .env.example)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # One-off import of the pre-Docker JSON store, if it is still around.
      # Read-only: Postgres is the source of truth from now on.
      - ./app/data:/app/data:ro

volumes:
  db_data:
